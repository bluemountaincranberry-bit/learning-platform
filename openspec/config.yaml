schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Project: Learning App, language learning through content.
  Stack: Laravel 12 in src/, Filament admin, Vue 3 SPA, TypeScript,
  Pinia, Vue Router, Vite, Docker, PostgreSQL and Redis.
  Architecture: modular monolith. Identify the owning module for each change.
  Read AGENTS.md, engineering/AGENT_BEHAVIOR.md and relevant engineering skills.
  .ai-orchestration/ remains the primary project workflow; OpenSpec is a pilot
  for explicitly selected changes. Do not migrate existing tasks or specs automatically.
  Consult .ai-orchestration/project-docs/project-overview.md and PROJECT_CONTEXT.md.
  Preserve unrelated working-tree changes. Keep implementation scope narrow.
  Follow engineering/testing-policy.md; run focused checks through Docker/Make.

rules:
  proposal:
    - State goals, non-goals, module ownership and decisions needing approval.
  specs:
    - Describe observable behavior with concrete success and failure scenarios.
  design:
    - Follow existing patterns; explain any API, data model or architecture changes.
  tasks:
    - Include relevant verification and durable documentation updates.
    - Do not mark tasks complete without evidence; record blocked checks explicitly.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
